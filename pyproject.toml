[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probesize"
version = "0.1.0"
description = "Open-source charged-particle microscope image resolution analysis (edge-resolution criterion)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.5"]

[project.scripts]
probesize = "probesize.cli:main"
probesize-gui = "probesize.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
